spring.application.name=sydney-info
server.port=${PORT:8080}

# Transport for NSW API key (register at https://opendata.transport.nsw.gov.au)
app.tfnsw.api-key=${TFNSW_API_KEY:}

# Optional: override car park facility ID (leave blank to auto-discover Cherrybrook)
app.tfnsw.carpark.facility-id=${CARPARK_FACILITY_ID:}

# Google Maps API key (enable Maps JavaScript API + Places API in Google Cloud Console)
app.google.maps-api-key=${GOOGLE_MAPS_API_KEY:}

# Ticketmaster Discovery API key (register at https://developer.ticketmaster.com)
app.ticketmaster.api-key=${TICKETMASTER_API_KEY:}

# Thymeleaf
spring.thymeleaf.cache=true
