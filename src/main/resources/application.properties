spring.application.name=sydney-info
server.port=${PORT:8080}

# Transport for NSW API key (register at https://opendata.transport.nsw.gov.au)
app.tfnsw.api-key=${TFNSW_API_KEY:}

# Optional: override car park facility ID (leave blank to auto-discover Cherrybrook)
app.tfnsw.carpark.facility-id=${CARPARK_FACILITY_ID:}

# Thymeleaf
spring.thymeleaf.cache=true

# ── PostgreSQL persistence (Railway) ──────────────────────────────────
# The datasource URL/username/password are derived at startup from Railway's
# DATABASE_URL (or SPRING_DATASOURCE_URL) by DatabaseUrlEnvironmentPostProcessor.
# When no database is configured, persistence auto-disables and the app still runs.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=Australia/Sydney
