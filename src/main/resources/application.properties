spring.application.name=sydney-info
server.port=${PORT:8080}

# Transport for NSW API key (register at https://opendata.transport.nsw.gov.au)
app.tfnsw.api-key=${TFNSW_API_KEY:}

# Cherrybrook Station car park facility ID (find at TfNSW Open Data portal)
app.tfnsw.carpark.facility-id=${CARPARK_FACILITY_ID:MACs100034}

# NSW FuelCheck API credentials (register at https://api.onegov.nsw.gov.au)
app.fuelcheck.client-id=${FUELCHECK_CLIENT_ID:}
app.fuelcheck.client-secret=${FUELCHECK_CLIENT_SECRET:}
app.fuelcheck.api-key=${FUELCHECK_API_KEY:}

# Thymeleaf
spring.thymeleaf.cache=true
